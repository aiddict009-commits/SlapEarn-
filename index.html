<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SlapEarn - Slap & Earn Cash Rewards</title>

    <meta name="theme-color" content="#00D09E" />

    <!-- iOS / Safari PWA Integration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SlapEarn" />

    <script>
      window.config = {
        general_config: {
          app_id: 35262,
          ext_user_id: "",
          email: ""
        },
        script_config: [
          { div_id: "sidebar", theme_style: 1, order_by: 1 },
          { div_id: "notification", theme_style: 4, position: 5, text: "", link: "", newtab: true }
        ],
        style_config: {
          topbar_background_color: "#ffaf20"
        }
      };
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-installable'));
      });
